<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <h2 id="form-title">Login</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="text" class="inp-email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" class="inp-pwd" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
            <p class="text-center mt-4">
                <span>Chưa có tài khoản?</span>
                <a href="../register/register.html" class="ms-1">Đăng ký</a>
            </p>
        </form>
        
        <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth-compat.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/11.1.0/firebase-auth-compat.min.js" integrity="sha512-CGUF+dWcHYjNE9r1tL1/sQMrkjl/dyY8+bKdmqnplDUJQ27LvTXneYIBK++44GDjetxGojYGxbzbHNBtEBzUuw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="../firebase-config.js"></script>

       
        <script src="login.js"></script>
</body>

</html>
